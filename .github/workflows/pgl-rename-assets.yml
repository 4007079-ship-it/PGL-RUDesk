name: PGL-RUDesk Rename Release Files

# rustdesk-1.5.1-x86_64.exe -> PGL-RUDesk-x86_64.exe: постоянные имена,
# чтобы прямые ссылки на сайте и в README не менялись с версией.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename release files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rel=$(gh api "repos/$REPO/releases/tags/pgl-rudesk" --jq .id)
          gh api --paginate "repos/$REPO/releases/$rel/assets" --jq '.[] | "\(.id) \(.name)"' > assets.txt
          ver=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' assets.txt | head -1 || true)
          if [ -n "$ver" ]; then
            gh api -X PATCH "repos/$REPO/releases/$rel" -f name="PGL-RUDesk $ver" --jq .name
          fi
          while read -r id name; do
            new="${name/#rustdesk/PGL-RUDesk}"
            new=$(printf '%s' "$new" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?//')
            [ "$new" = "$name" ] && continue
            stale=$(awk -v n="$new" '$2 == n { print $1 }' assets.txt)
            if [ -n "$stale" ]; then
              gh api -X DELETE "repos/$REPO/releases/assets/$stale"
            fi
            gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$new" --jq .name
          done < assets.txt
