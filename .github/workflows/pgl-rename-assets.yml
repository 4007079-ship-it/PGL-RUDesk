name: PGL-RUDesk Rename Release Files

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename rustdesk-* files to PGL-RUDesk-*
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rel=$(gh api "repos/$REPO/releases/tags/pgl-rudesk" --jq .id)
          gh api -X PATCH "repos/$REPO/releases/$rel" -f name="PGL-RUDesk" --jq .name
          gh api --paginate "repos/$REPO/releases/$rel/assets" --jq '.[] | "\(.id) \(.name)"' > assets.txt
          while read -r id name; do
            case "$name" in rustdesk*) ;; *) continue ;; esac
            new="PGL-RUDesk${name#rustdesk}"
            stale=$(awk -v n="$new" '$2 == n { print $1 }' assets.txt)
            if [ -n "$stale" ]; then
              gh api -X DELETE "repos/$REPO/releases/assets/$stale"
            fi
            gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$new" --jq .name
          done < assets.txt
