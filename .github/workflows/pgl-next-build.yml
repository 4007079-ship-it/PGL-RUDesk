name: PGL-Next Build

# Собирает новый сервер PGL (pgl-next) и кладёт бинарники в релиз с тегом pgl-next.
# Запуск: вкладка Actions → «PGL-Next Build» → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pgl-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build server (linux amd64 + arm64)
        run: |
          mkdir -p out
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o out/pgl-server-linux-amd64 ./cmd/pgl-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o out/pgl-server-linux-arm64 ./cmd/pgl-server

      - name: Build host (Windows + Linux)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o out/PGL-Host.exe ./cmd/pgl-host
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o out/pgl-host-linux-amd64 ./cmd/pgl-host

      - name: Verify Windows capture/input build
        run: GOOS=windows GOARCH=amd64 go vet ./internal/capture/ ./internal/input/

      - name: Test
        run: go test ./internal/...

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: pgl-next
          name: PGL-Next (server preview)
          files: |
            pgl-next/out/pgl-server-linux-amd64
            pgl-next/out/pgl-server-linux-arm64
            pgl-next/out/PGL-Host.exe
            pgl-next/out/pgl-host-linux-amd64
